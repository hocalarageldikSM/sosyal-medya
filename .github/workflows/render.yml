name: HG gorsel uret

on:
  workflow_dispatch:
    inputs:
      paylasim_id:
        description: "Paylaşım kimliği (klasör adı), ör. 2026-10-01-sabah-gundem"
        required: true
      isler:
        description: "Şablon işleri (JSON dizi): [{sablon, dosya, veri}]"
        required: true

permissions:
  contents: write

concurrency:
  group: hg-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kurulum
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium

      - name: Görselleri üret
        env:
          ISLER: ${{ inputs.isler }}
          PID: ${{ inputs.paylasim_id }}
        run: |
          case "$PID" in (*[!A-Za-z0-9._-]*|"") echo "Geçersiz paylasim_id"; exit 1;; esac
          W=/tmp/motor; mkdir -p $W/templates $W/logos $W/fonts
          cp render.py $W/
          if [ -d templates ]; then cp templates/* $W/templates/; else cp *.html base.css $W/templates/; fi
          if [ -d logos ]; then cp logos/* $W/logos/; else cp *.png $W/logos/; fi
          if [ -d fonts ]; then cp fonts/* $W/fonts/; else cp *.ttf $W/fonts/; fi
          printf '%s' "$ISLER" > /tmp/isler.json
          (cd $W && python render.py /tmp/isler.json out)
          mkdir -p "cikti/$PID" && cp $W/out/* "cikti/$PID/"

      - name: Kaydet
        env:
          PID: ${{ inputs.paylasim_id }}
        run: |
          git config user.name "hg-render-bot"
          git config user.email "hg-render-bot@users.noreply.github.com"
          git add "cikti/$PID"
          git commit -m "Görsel: $PID"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
