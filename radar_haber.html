<!doctype html><html lang="tr"><head><meta charset="utf-8"><style>@font-face{font-family:"Anton";src:url("../fonts/Anton-Regular.ttf")}@font-face{font-family:"Montserrat";src:url("../fonts/Montserrat.ttf");font-weight:100 900} :root{--mavi:#3A589E;--lacivert:#184077;--turuncu:#F19107;--kiremit:#F15725;--zemin:#F3F6FC} *{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1350px;overflow:hidden} body{font-family:"Montserrat",sans-serif;-webkit-font-smoothing:antialiased} .mono{font-family:"DejaVu Sans Mono","Noto Sans Mono",monospace} .anton{font-family:"Anton";font-weight:400;line-height:1.02;letter-spacing:.3px} .frame{position:relative;width:1080px;height:1350px;overflow:hidden;color:var(--lacivert); background:radial-gradient(900px 700px at 100% 0%,rgba(58,88,158,.18),transparent 60%),radial-gradient(800px 600px at 0% 100%,rgba(241,145,7,.16),transparent 60%),var(--zemin)} .frame::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(58,88,158,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(58,88,158,.08) 1px,transparent 1px);background-size:36px 36px} .frame>*{z-index:1} .kose{position:absolute;width:64px;height:64px;border:5px solid var(--turuncu);z-index:2} .k1{top:40px;left:40px;border-right:0;border-bottom:0}.k2{top:40px;right:40px;border-left:0;border-bottom:0}.k3{bottom:40px;left:40px;border-right:0;border-top:0}.k4{bottom:40px;right:40px;border-left:0;border-top:0} .hud{position:absolute;top:78px;left:84px;right:84px;display:flex;justify-content:space-between;align-items:center;font-size:24px;letter-spacing:2px;color:var(--mavi);font-weight:700} .hud .canli{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--turuncu);box-shadow:0 0 0 6px rgba(241,145,7,.25);margin-right:14px;vertical-align:middle} .cip{font-family:"Anton";font-size:36px;letter-spacing:2px;color:#fff;padding:6px 24px 10px;border-radius:14px;background:var(--mavi);box-shadow:0 8px 0 var(--turuncu)} .alt{position:absolute;left:84px;right:84px;bottom:78px;display:flex;align-items:flex-end;justify-content:space-between} .alt .logo{width:260px;filter:drop-shadow(0 10px 18px rgba(24,64,119,.25))} .imza{font-size:22px;color:var(--mavi);letter-spacing:1px;text-align:right;line-height:1.7;font-weight:700} .imza b{color:var(--turuncu)} .imlec{display:inline-block;width:14px;height:24px;background:var(--turuncu);vertical-align:-4px;margin-left:4px} .foto{position:absolute;top:150px;left:84px;right:84px;height:600px;z-index:0;overflow:hidden;border-radius:28px;border:6px solid #fff;box-shadow:0 20px 44px rgba(24,64,119,.22)} .foto img{width:100%;height:100%;object-fit:cover;object-position:center 40%;display:block} .kaynak{position:absolute;top:705px;left:84px;display:flex;align-items:center;gap:14px;font-family:"Anton";font-size:46px;letter-spacing:1px;color:#fff;background:var(--turuncu);border-radius:14px;padding:6px 26px 10px;box-shadow:0 8px 0 var(--kiremit);transform:rotate(-1.5deg);z-index:2}.kaynak small{font-family:"Montserrat";font-weight:800;font-size:26px;letter-spacing:2px;opacity:.95} .blok{position:absolute;top:830px;left:84px;right:84px} h1{font-size:{{baslik_boyut}}px;color:var(--lacivert)} .metin{margin-top:20px;margin-right:30px;font-size:32px;line-height:1.45;color:#4A5F86;font-weight:500} </style></head><body><div class="frame">
<div class="kose k1"></div><div class="kose k2"></div><div class="kose k3"></div><div class="kose k4"></div>
<div class="hud mono"><span><i class="canli"></i>SİNYAL {{sira}}/{{toplam}} · {{tarih}}</span><span class="cip">{{tur}}</span></div>
<div class="foto"><img src="{{gorsel}}"></div>
<div class="kaynak">{{sube}} <small>BAŞARI MERKEZİ</small></div>
<div class="blok"><h1 class="anton">{{baslik}}</h1><p class="metin">{{metin}}</p></div>
<div class="alt"><img class="logo" src="../logos/bm_kutu_planlama.png"><div class="imza mono">@{{hesap}}<br><b>#GEL</b><i class="imlec"></i></div></div>
</div></body></html>
