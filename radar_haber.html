<!doctype html><html lang="tr"><head><meta charset="utf-8"><style>@font-face{font-family:"Anton";src:url("../fonts/Anton-Regular.ttf")}@font-face{font-family:"Montserrat";src:url("../fonts/Montserrat.ttf");font-weight:100 900}:root{--mavi:#3A589E;--lacivert:#184077;--turuncu:#F19107;--kiremit:#F15725;--cam:#070C18;--neon:#6FA8FF;--yesil:#3DDC97;--kirmizi:#FF4D5E}*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1350px;overflow:hidden}body{font-family:"Montserrat",sans-serif;-webkit-font-smoothing:antialiased}.mono{font-family:"DejaVu Sans Mono","Noto Sans Mono",monospace}.anton{font-family:"Anton";font-weight:400;line-height:1.02;letter-spacing:.3px}.frame{position:relative;width:1080px;height:1350px;overflow:hidden;color:#fff;background:radial-gradient(900px 700px at 85% 10%,rgba(58,88,158,.55),transparent 60%),radial-gradient(800px 600px at 0% 100%,rgba(241,145,7,.16),transparent 60%),var(--cam)}.frame::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(111,168,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(111,168,255,.07) 1px,transparent 1px);background-size:36px 36px}.frame::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,transparent 2px 5px)}.frame>*{z-index:1}.kose{position:absolute;width:64px;height:64px;border:4px solid var(--turuncu);z-index:2}.k1{top:40px;left:40px;border-right:0;border-bottom:0}.k2{top:40px;right:40px;border-left:0;border-bottom:0}.k3{bottom:40px;left:40px;border-right:0;border-top:0}.k4{bottom:40px;right:40px;border-left:0;border-top:0}.hud{position:absolute;top:78px;left:84px;right:84px;display:flex;justify-content:space-between;align-items:center;font-size:24px;letter-spacing:2px;color:var(--neon)}.hud .canli{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--yesil);box-shadow:0 0 14px var(--yesil);margin-right:14px;vertical-align:middle}.cip{font-family:"Anton";font-size:34px;letter-spacing:2px;color:#fff;padding:6px 26px 10px;border:3px solid var(--turuncu);border-radius:14px;background:rgba(7,12,24,.75);box-shadow:0 0 24px rgba(241,145,7,.35)}.alt{position:absolute;left:84px;right:84px;bottom:78px;display:flex;align-items:flex-end;justify-content:space-between}.alt .logo{width:250px;filter:drop-shadow(0 10px 22px rgba(0,0,0,.5))}.imlec{display:inline-block;width:14px;height:24px;background:var(--turuncu);vertical-align:-4px;margin-left:4px}.foto{position:absolute;top:0;left:0;right:0;height:820px;z-index:0;overflow:hidden}.foto img{width:100%;height:100%;object-fit:cover;object-position:center 30%}.foto::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,12,24,.55) 0%,rgba(7,12,24,0) 22%,rgba(7,12,24,0) 60%,#070C18 100%),repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 5px)}.kaynak{position:absolute;top:660px;left:84px;font-size:22px;letter-spacing:2px;background:rgba(7,12,24,.85);border:2px solid var(--turuncu);border-radius:10px;padding:10px 18px}.kaynak b{color:var(--turuncu)}.blok{position:absolute;top:740px;left:84px;right:84px}h1{font-size:{{baslik_boyut}}px}.metin{margin-top:22px;margin-right:30px;font-size:32px;line-height:1.45;color:rgba(255,255,255,.85);font-weight:500}.hesap{font-size:22px;color:var(--neon);letter-spacing:1px;text-align:right;line-height:1.7}.hesap b{color:var(--turuncu)}</style></head><body><div class="frame">
<div class="foto"><img src="{{gorsel}}"></div>
<div class="kose k1"></div><div class="kose k2"></div><div class="kose k3"></div><div class="kose k4"></div>
<div class="hud mono"><span style="background:rgba(7,12,24,.7);padding:6px 12px;border-radius:8px"><i class="canli"></i>SİNYAL {{sira}}/{{toplam}} · {{tarih}}</span><span class="cip">{{tur}}</span></div>
<div class="kaynak mono">KAYNAK: <b>{{sube}} BAŞARI MERKEZİ</b></div>
<div class="blok"><h1 class="anton">{{baslik}}</h1><p class="metin">{{metin}}</p></div>
<div class="alt"><img class="logo" src="../logos/bm_kutu_planlama.png"><div class="hesap mono">@{{hesap}}<br><b>#GEL</b><i class="imlec"></i></div></div>
</div></body></html>
