<!doctype html><html lang="tr"><head><meta charset="utf-8"><style>@font-face{font-family:"Anton";src:url("../fonts/Anton-Regular.ttf")}@font-face{font-family:"Montserrat";src:url("../fonts/Montserrat.ttf");font-weight:100 900} :root{--mavi:#3A589E;--lacivert:#184077;--turuncu:#F19107;--kiremit:#F15725} *{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1350px;overflow:hidden} body{font-family:"Montserrat",sans-serif;-webkit-font-smoothing:antialiased} .frame{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--lacivert);color:var(--lacivert)} .frame>*{z-index:1} .bg{position:absolute;inset:0;z-index:0} .bg img{width:100%;height:100%;object-fit:cover;display:block} .golge{position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(24,64,119,.45) 0%,rgba(24,64,119,0) 22%,rgba(24,64,119,0) 48%,rgba(24,64,119,.75) 78%,rgba(24,64,119,.92) 100%)} .ust{position:absolute;top:56px;left:56px;right:56px;display:flex;justify-content:space-between;align-items:flex-start} .radarcik{display:flex;align-items:center;gap:12px;background:#fff;color:var(--mavi);font:800 24px "Montserrat";letter-spacing:2px;padding:12px 20px;border-radius:999px;box-shadow:0 8px 20px rgba(0,0,0,.2)} .radarcik i{width:22px;height:22px;border-radius:50%;border:3px solid var(--turuncu);position:relative} .radarcik i::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--turuncu)} .cip{font-family:"Anton";font-size:40px;color:#fff;background:var(--turuncu);padding:6px 24px 10px;border-radius:14px;transform:rotate(4deg);box-shadow:0 8px 0 var(--kiremit)} .bant{font-family:"Anton";font-weight:400;line-height:1.28;letter-spacing:.5px} .bant span{background:#fff;color:var(--lacivert);padding:0 22px 6px;border-radius:14px;-webkit-box-decoration-break:clone;box-decoration-break:clone;box-shadow:0 10px 0 var(--turuncu)} .logo{width:250px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.35))} .bg img{object-position:{{odak}};transform:scale({{yakin}});transform-origin:{{odak}}} .alttaki{position:absolute;left:56px;right:56px;bottom:56px;display:flex;flex-direction:column;align-items:flex-start} .sube{font-family:"Anton";font-size:104px;line-height:1;color:#fff;background:var(--turuncu);padding:8px 30px 16px;border-radius:20px;transform:rotate(-3deg);box-shadow:0 12px 0 var(--kiremit);margin-left:-6px} .bm{margin:-6px 0 0 60px;font:800 26px "Montserrat";letter-spacing:4px;color:#fff;background:var(--mavi);padding:10px 20px;border-radius:10px;transform:rotate(-3deg);position:relative;z-index:2} h1{margin-top:44px;font-size:{{baslik_boyut}}px} .metin{margin-top:30px;max-width:900px;font-size:31px;line-height:1.42;font-weight:600;color:#fff;background:rgba(24,64,119,.82);padding:18px 24px;border-radius:16px;border-left:8px solid var(--turuncu)} .son{margin-top:26px;width:100%;display:flex;justify-content:space-between;align-items:flex-end} .hesap{font:800 24px "Montserrat";color:var(--lacivert);background:#fff;padding:10px 18px;border-radius:999px} .hesap b{color:var(--turuncu)} </style></head><body><div class="frame">
<div class="bg"><img src="{{gorsel}}"></div><div class="golge"></div>
<div class="ust"><div class="radarcik"><i></i>ŞUBE RADARI · {{sira}}/{{toplam}}</div><div class="cip">{{tur}}</div></div>
<div class="alttaki">
<div class="sube">{{sube}}</div><div class="bm">BAŞARI MERKEZİ · {{tarih}}</div>
<h1 class="bant"><span>{{baslik}}</span></h1>
<p class="metin">{{metin}}</p>
<div class="son"><img class="logo" src="../logos/bm_kutu_planlama.png"><div class="hesap">@{{hesap}} <b>#GEL</b></div></div>
</div>
</div></body></html>
