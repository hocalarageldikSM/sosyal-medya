<!doctype html><html lang="tr"><head><meta charset="utf-8"><style>@font-face{font-family:"Anton";src:url("../fonts/Anton-Regular.ttf")}@font-face{font-family:"Montserrat";src:url("../fonts/Montserrat.ttf");font-weight:100 900} :root{--mavi:#3A589E;--lacivert:#184077;--turuncu:#F19107;--kiremit:#F15725} *{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1350px;overflow:hidden} body{font-family:"Montserrat",sans-serif;-webkit-font-smoothing:antialiased} .frame{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--lacivert);color:var(--lacivert)} .frame>*{z-index:1} .bg{position:absolute;inset:0;z-index:0} .bg img{width:100%;height:100%;object-fit:cover;display:block} .golge{position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(24,64,119,.45) 0%,rgba(24,64,119,0) 22%,rgba(24,64,119,0) 48%,rgba(24,64,119,.75) 78%,rgba(24,64,119,.92) 100%)} .ust{position:absolute;top:56px;left:56px;right:56px;display:flex;justify-content:space-between;align-items:flex-start} .radarcik{display:flex;align-items:center;gap:12px;background:#fff;color:var(--mavi);font:800 24px "Montserrat";letter-spacing:2px;padding:12px 20px;border-radius:999px;box-shadow:0 8px 20px rgba(0,0,0,.2)} .radarcik i{width:22px;height:22px;border-radius:50%;border:3px solid var(--turuncu);position:relative} .radarcik i::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--turuncu)} .cip{font-family:"Anton";font-size:40px;color:#fff;background:var(--turuncu);padding:6px 24px 10px;border-radius:14px;transform:rotate(4deg);box-shadow:0 8px 0 var(--kiremit)} .bant{font-family:"Anton";font-weight:400;line-height:1.28;letter-spacing:.5px} .bant span{background:#fff;color:var(--lacivert);padding:0 22px 6px;border-radius:14px;-webkit-box-decoration-break:clone;box-decoration-break:clone;box-shadow:0 10px 0 var(--turuncu)} .logo{width:250px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.35))} .bg img{object-position:{{odak}};transform:scale({{yakin}});transform-origin:{{odak}}} .alttaki{position:absolute;left:56px;right:56px;bottom:56px;display:flex;flex-direction:column;align-items:flex-start} .sube{font-family:"Anton";font-size:104px;line-height:1;color:#fff;background:var(--turuncu);padding:8px 30px 16px;border-radius:20px;transform:rotate(-3deg);box-shadow:0 12px 0 var(--kiremit);margin-left:-6px} .bm{margin:-6px 0 0 60px;font:800 26px "Montserrat";letter-spacing:4px;color:#fff;background:var(--mavi);padding:10px 20px;border-radius:10px;transform:rotate(-3deg);position:relative;z-index:2} h1{margin-top:0;font-size:{{baslik_boyut}}px} .metin{margin-top:30px;max-width:900px;font-size:31px;line-height:1.42;font-weight:600;color:#fff;background:rgba(24,64,119,.82);padding:18px 24px;border-radius:16px;border-left:8px solid var(--turuncu)} .son{margin-top:26px;width:100%;display:flex;justify-content:space-between;align-items:flex-end} .hesap{font:800 24px "Montserrat";color:var(--lacivert);background:#fff;padding:10px 18px;border-radius:999px} .hesap b{color:var(--turuncu)} .ajan{background:#070C18}.ajan .bg img{filter:saturate(.7) contrast(1.08)}.ajan .golge{background:linear-gradient(180deg,rgba(7,12,24,.65) 0%,rgba(7,12,24,.05) 24%,rgba(7,12,24,.1) 44%,rgba(7,12,24,.86) 70%,#070C18 100%)}.ajan::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 5px)}.ajan::before{content:"";position:absolute;inset:30px;z-index:3;pointer-events:none;background:linear-gradient(#F19107,#F19107) 0 0/70px 5px no-repeat,linear-gradient(#F19107,#F19107) 0 0/5px 70px no-repeat,linear-gradient(#F19107,#F19107) 100% 0/70px 5px no-repeat,linear-gradient(#F19107,#F19107) 100% 0/5px 70px no-repeat,linear-gradient(#F19107,#F19107) 0 100%/70px 5px no-repeat,linear-gradient(#F19107,#F19107) 0 100%/5px 70px no-repeat,linear-gradient(#F19107,#F19107) 100% 100%/70px 5px no-repeat,linear-gradient(#F19107,#F19107) 100% 100%/5px 70px no-repeat}.ajan .radarcik{background:rgba(7,12,24,.88);color:#6FA8FF;border:2px solid rgba(111,168,255,.55);font-family:"DejaVu Sans Mono",monospace}.ajan .radarcik i{border-color:#3DDC97}.ajan .radarcik i::after{background:#3DDC97}.ajan .cip{background:rgba(7,12,24,.88);border:3px solid #F19107;box-shadow:0 0 24px rgba(241,145,7,.5);transform:none}.ajan .bant span{background:rgba(7,12,24,.92);color:#fff;box-shadow:inset 8px 0 0 #F19107,0 0 0 2px rgba(111,168,255,.4)}.ajan .bant span.o{background:#F19107;box-shadow:0 0 26px rgba(241,145,7,.6)}.ajan .sube{transform:none;border-radius:10px;box-shadow:0 0 34px rgba(241,145,7,.6)}.ajan .sube::before{content:"HEDEF › ";font-family:"DejaVu Sans Mono",monospace;font-size:30px;vertical-align:middle;opacity:.9}.ajan .bm{transform:none;background:rgba(7,12,24,.92);border:2px solid #6FA8FF;color:#6FA8FF;font-family:"DejaVu Sans Mono",monospace;margin-top:14px}.ajan .metin{background:rgba(7,12,24,.9);border-left-color:#3DDC97;color:#EAF1FF}.ajan .hesap,.ajan .not{background:rgba(7,12,24,.92);color:#6FA8FF;font-family:"DejaVu Sans Mono",monospace;border:2px solid rgba(111,168,255,.55)}.ajan .hesap b{color:#F19107}.ajan .kaydir{background:rgba(7,12,24,.92);color:#fff;box-shadow:0 0 0 3px #F19107,0 0 24px rgba(241,145,7,.5)}.ajan .cagri{transform:none;box-shadow:0 0 34px rgba(241,145,7,.55)}.ajan .radar{background:radial-gradient(circle,#F19107 0 8px,transparent 9px),radial-gradient(circle,transparent 0 24.5%,rgba(111,168,255,.55) 25% 25.5%,transparent 26% 49.5%,rgba(111,168,255,.55) 50% 50.5%,transparent 51% 74.5%,rgba(111,168,255,.55) 75% 75.5%,transparent 76%),conic-gradient(from 18deg,rgba(241,145,7,.6),rgba(241,145,7,0) 80deg,transparent 360deg),rgba(7,12,24,.86);border:4px solid #6FA8FF;box-shadow:0 0 50px rgba(111,168,255,.5)}.ajan .radar::before,.ajan .radar::after{background:rgba(111,168,255,.4)}.ajan .blipler span{background:rgba(7,12,24,.95);border:2px solid #F19107;box-shadow:0 0 18px rgba(241,145,7,.55)}.etiketcik{display:flex;padding:0;overflow:hidden;background:none;font-size:40px;transform:rotate(2deg)}.etiketcik b{font-weight:400;background:var(--turuncu);padding:6px 18px 10px}.etiketcik span{background:#fff;color:var(--lacivert);padding:6px 18px 10px}.tarihcik{font:800 22px "Montserrat";letter-spacing:3px;color:#fff;background:var(--mavi);padding:8px 16px;border-radius:8px;margin-bottom:18px}.ajan .etiketcik{border:3px solid #F19107;box-shadow:0 0 24px rgba(241,145,7,.5)}.ajan .etiketcik span{background:rgba(7,12,24,.92);color:#fff}.ajan .tarihcik{font-family:"DejaVu Sans Mono",monospace;background:rgba(7,12,24,.92);color:#6FA8FF;border:2px solid rgba(111,168,255,.55)}</style></head><body><div class="frame {{tema}}">
<div class="bg"><img src="{{gorsel}}"></div><div class="golge"></div>

</div>
</div></body></html>
