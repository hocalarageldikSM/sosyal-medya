<!doctype html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.frame{background:var(--lacivert);color:#fff;padding:96px 88px 200px;display:flex;flex-direction:column;justify-content:center}
.amblem{position:absolute;right:-170px;top:250px;width:760px;opacity:.07}
.etiket{background:var(--kiremit);align-self:flex-start}
h1{font-size:{{baslik_boyut}}px;margin-top:56px;max-width:900px}
.kutu{margin-top:64px;background:#fff;color:var(--lacivert);border-radius:28px;padding:44px 48px;display:grid;gap:30px;transform:rotate(-1deg);max-width:880px}
.satir{display:flex;flex-direction:column;gap:6px}
.satir b{font-size:24px;font-weight:700;color:var(--mavi)}
.satir span{font-family:"Anton";font-size:52px;line-height:1.05}
.not{margin-top:56px;font-size:30px;font-weight:500;line-height:1.4;max-width:820px;opacity:.92}
.alt{position:absolute;left:88px;right:88px;bottom:72px;display:flex;justify-content:space-between;align-items:flex-end}
.alt>img{height:132px;}
.rozet{display:flex;align-items:center;gap:22px;background:#fff;border-radius:22px;padding:16px 30px 16px 18px;color:var(--lacivert)}
.rozet img{height:104px;width:auto;max-width:220px;object-fit:contain}
.rozet .yer{width:104px;height:104px;border:3px dashed #9AA8C7;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#7E8DB0;text-align:center}
.rozet small{display:block;font-size:18px;font-weight:600;color:var(--soluk)}
.rozet b{display:block;font-family:"Anton";font-size:40px;line-height:1.05;letter-spacing:.5px}
</style></head><body><div class="frame">{{zemin}}
<img class="amblem" src="../logos/amblem_beyaz.png">
<div class="etiket">{{etiket}}</div>
<h1 class="anton">{{baslik}}</h1>
<div class="kutu">{{satirlar}}</div>
<p class="not">{{not}}</p>
<div class="alt">{{kaynak_rozet}}<img class="hg-logo" src="../logos/bm_kutu_planlama.png"></div>
</div></body></html>
