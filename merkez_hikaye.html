<!doctype html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
/* Merkez kampanya HIKAYE cercevesi (1080x1920). Ust/alt ~250px Instagram arayuzu icin bos birakilir. */
html,body{height:1920px!important}
.frame{height:1920px!important;background:var(--lacivert);color:#fff}
.desen{position:absolute!important;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.06) 2px,transparent 2px);background-size:54px 54px}
.ust{position:absolute!important;left:0;right:0;top:250px;display:flex;justify-content:center}
.sube{display:inline-flex;align-items:center;gap:16px;background:var(--turuncu);color:#fff;font-family:"Anton";font-size:46px;line-height:1;padding:20px 38px 22px 30px;border-radius:24px;transform:rotate(-2deg);box-shadow:0 10px 0 rgba(0,0,0,.18)}
.sube svg{width:40px;height:48px;flex:none}
.kart{position:absolute!important;left:90px;right:90px;top:380px;height:1125px;border-radius:36px;overflow:hidden;background:#fff;border:10px solid #fff;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.kart img{width:100%;height:100%;object-fit:cover;display:block;border-radius:26px}
.alt{position:absolute!important;left:90px;right:90px;top:1555px;text-align:center}
.hesap{font-size:40px;font-weight:700;line-height:1.3}
.hesap small{display:block;font-size:26px;font-weight:600;opacity:.75;letter-spacing:1px}
</style></head><body><div class="frame">
<div class="desen"></div>
<div class="ust"><div class="sube"><svg viewBox="0 0 24 30"><path d="M12 0C5.4 0 0 5.2 0 11.7 0 20.4 12 30 12 30s12-9.6 12-18.3C24 5.2 18.6 0 12 0zm0 16.2a4.6 4.6 0 1 1 0-9.2 4.6 4.6 0 0 1 0 9.2z" fill="#fff"/></svg>{{sube}}</div></div>
<div class="kart"><img src="{{gorsel}}"></div>
<div class="alt"><div class="hesap"><small>Detaylar için şubemizi takip et</small>@{{hesap}}</div></div>
</div></body></html>
