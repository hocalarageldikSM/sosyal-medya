<!doctype html><html lang="tr"><head><meta charset="utf-8"><style>@font-face{font-family:"Anton";src:url("../fonts/Anton-Regular.ttf")}@font-face{font-family:"Montserrat";src:url("../fonts/Montserrat.ttf");font-weight:100 900}:root{--mavi:#3A589E;--lacivert:#184077;--turuncu:#F19107;--kiremit:#F15725;--cam:#070C18;--neon:#6FA8FF;--yesil:#3DDC97;--kirmizi:#FF4D5E}*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1350px;overflow:hidden}body{font-family:"Montserrat",sans-serif;-webkit-font-smoothing:antialiased}.mono{font-family:"DejaVu Sans Mono","Noto Sans Mono",monospace}.anton{font-family:"Anton";font-weight:400;line-height:1.02;letter-spacing:.3px}.frame{position:relative;width:1080px;height:1350px;overflow:hidden;color:#fff;background:radial-gradient(900px 700px at 85% 10%,rgba(58,88,158,.55),transparent 60%),radial-gradient(800px 600px at 0% 100%,rgba(241,145,7,.16),transparent 60%),var(--cam)}.frame::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(111,168,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(111,168,255,.07) 1px,transparent 1px);background-size:36px 36px}.frame::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,transparent 2px 5px)}.frame>*{z-index:1}.kose{position:absolute;width:64px;height:64px;border:4px solid var(--turuncu);z-index:2}.k1{top:40px;left:40px;border-right:0;border-bottom:0}.k2{top:40px;right:40px;border-left:0;border-bottom:0}.k3{bottom:40px;left:40px;border-right:0;border-top:0}.k4{bottom:40px;right:40px;border-left:0;border-top:0}.hud{position:absolute;top:78px;left:84px;right:84px;display:flex;justify-content:space-between;align-items:center;font-size:24px;letter-spacing:2px;color:var(--neon)}.hud .canli{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--yesil);box-shadow:0 0 14px var(--yesil);margin-right:14px;vertical-align:middle}.cip{font-family:"Anton";font-size:34px;letter-spacing:2px;color:#fff;padding:6px 26px 10px;border:3px solid var(--turuncu);border-radius:14px;background:rgba(241,145,7,.14);box-shadow:0 0 24px rgba(241,145,7,.35)}.alt{position:absolute;left:84px;right:84px;bottom:78px;display:flex;align-items:flex-end;justify-content:space-between}.alt .logo{width:270px;filter:drop-shadow(0 10px 22px rgba(0,0,0,.5))}.sistem{font-size:20px;color:rgba(255,255,255,.55);letter-spacing:1px;line-height:1.6;text-align:right}.sistem b{color:var(--turuncu);font-weight:700}.imlec{display:inline-block;width:14px;height:24px;background:var(--turuncu);vertical-align:-4px;margin-left:4px}.serit{position:absolute;top:170px;left:84px;right:84px;height:330px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.serit img{width:100%;height:100%;min-height:0;object-fit:cover;object-position:center 30%;border-radius:16px;border:2px solid rgba(111,168,255,.4);filter:saturate(.85)}.ust{position:absolute;top:580px;left:84px;font-size:26px;letter-spacing:3px;color:var(--yesil)}h1{position:absolute;top:630px;left:84px;right:84px;font-size:{{baslik_boyut}}px}.metin{position:absolute;top:895px;left:84px;right:110px;font-size:33px;line-height:1.45;color:rgba(255,255,255,.85);font-weight:500}.cagri{position:absolute;top:1020px;left:84px;right:84px;display:flex;align-items:center;justify-content:space-between;padding:22px 30px;border:3px solid var(--turuncu);border-radius:20px;background:rgba(241,145,7,.12);box-shadow:0 0 30px rgba(241,145,7,.25)}.cagri b{font-family:"Anton";font-weight:400;font-size:44px}.cagri span{font-family:"Anton";font-size:52px;color:var(--turuncu)}</style></head><body><div class="frame">
<div class="kose k1"></div><div class="kose k2"></div><div class="kose k3"></div><div class="kose k4"></div>
<div class="hud mono"><span><i class="canli"></i>ŞUBE RADARI // RAPOR SONU</span><span class="cip">27 MERKEZ</span></div>
<div class="serit">{{fotolar}}</div>
<div class="ust mono">✓ TARAMA TAMAMLANDI</div>
<h1 class="anton">{{baslik}}</h1>
<p class="metin">{{metin}}</p>
<div class="cagri"><b>{{cagri}}</b><span>#GEL</span></div>
<div class="alt"><img class="logo" src="../logos/bm_kutu_planlama.png"><div class="sistem mono">haftalık<br><b>şube radarı</b><i class="imlec"></i></div></div>
</div></body></html>
