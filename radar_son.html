<!doctype html><html lang="tr"><head><meta charset="utf-8"><style>@font-face{font-family:"Anton";src:url("../fonts/Anton-Regular.ttf")}@font-face{font-family:"Montserrat";src:url("../fonts/Montserrat.ttf");font-weight:100 900} :root{--mavi:#3A589E;--lacivert:#184077;--turuncu:#F19107;--kiremit:#F15725} *{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1350px;overflow:hidden} body{font-family:"Montserrat",sans-serif;-webkit-font-smoothing:antialiased} .frame{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--lacivert);color:var(--lacivert)} .frame>*{z-index:1} .bg{position:absolute;inset:0;z-index:0} .bg img{width:100%;height:100%;object-fit:cover;display:block} .golge{position:absolute;inset:0;z-index:0} .ust{position:absolute;top:56px;left:56px;right:56px;display:flex;justify-content:space-between;align-items:flex-start} .radarcik{display:flex;align-items:center;gap:12px;background:#fff;color:var(--mavi);font:800 24px "Montserrat";letter-spacing:2px;padding:12px 20px;border-radius:999px;box-shadow:0 8px 20px rgba(0,0,0,.2)} .radarcik i{width:22px;height:22px;border-radius:50%;border:3px solid var(--turuncu);position:relative} .radarcik i::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--turuncu)} .cip{font-family:"Anton";font-size:40px;color:#fff;background:var(--turuncu);padding:6px 24px 10px;border-radius:14px;transform:rotate(4deg);box-shadow:0 8px 0 var(--kiremit)} .bant{font-family:"Anton";font-weight:400;line-height:1.28;letter-spacing:.5px} .bant span{background:#fff;color:var(--lacivert);padding:0 22px 6px;border-radius:14px;-webkit-box-decoration-break:clone;box-decoration-break:clone;box-shadow:0 10px 0 var(--turuncu)} .logo{width:250px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.35))} .bg{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:675px 675px;gap:8px;background:#fff} .bg img{min-height:0;object-position:center 35%} .golge{background:linear-gradient(180deg,rgba(24,64,119,.35) 0%,rgba(24,64,119,.55) 40%,rgba(24,64,119,.9) 100%)} .alttaki{position:absolute;left:56px;right:56px;bottom:56px;display:flex;flex-direction:column;align-items:flex-start} h1{font-size:{{baslik_boyut}}px} .metin{margin-top:34px;max-width:900px;font-size:31px;line-height:1.42;font-weight:600;color:#fff;background:rgba(24,64,119,.85);padding:18px 24px;border-radius:16px;border-left:8px solid var(--turuncu)} .cagri{margin-top:34px;display:flex;align-items:center;gap:22px;font-family:"Anton";font-size:52px;color:#fff;background:var(--turuncu);padding:10px 30px 16px;border-radius:18px;transform:rotate(-2deg);box-shadow:0 12px 0 var(--kiremit)} .cagri span{background:#fff;color:var(--kiremit);border-radius:12px;padding:0 16px 4px;transform:rotate(4deg)} .son{margin-top:40px;width:100%;display:flex;justify-content:space-between;align-items:flex-end} .not{font:800 24px "Montserrat";color:var(--lacivert);background:#fff;padding:10px 18px;border-radius:999px} </style></head><body><div class="frame">
<div class="bg">{{fotolar}}</div><div class="golge"></div>
<div class="ust"><div class="radarcik"><i></i>ŞUBE RADARI · RAPOR SONU</div><div class="cip">27 MERKEZ</div></div>
<div class="alttaki">
<h1 class="bant"><span>{{baslik}}</span></h1>
<p class="metin">{{metin}}</p>
<div class="cagri">{{cagri}} <span>#GEL</span></div>
<div class="son"><img class="logo" src="../logos/bm_kutu_planlama.png"><div class="not">her hafta yeni haberler</div></div>
</div>
</div></body></html>
