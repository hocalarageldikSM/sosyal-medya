<!doctype html><html lang="tr"><head><meta charset="utf-8"><style>@font-face{font-family:"Anton";src:url("../fonts/Anton-Regular.ttf")}@font-face{font-family:"Montserrat";src:url("../fonts/Montserrat.ttf");font-weight:100 900} :root{--mavi:#3A589E;--lacivert:#184077;--turuncu:#F19107;--kiremit:#F15725} *{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1350px;overflow:hidden} body{font-family:"Montserrat",sans-serif;-webkit-font-smoothing:antialiased} .frame{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--lacivert);color:var(--lacivert)} .frame>*{z-index:1} .bg{position:absolute;inset:0;z-index:0} .bg img{width:100%;height:100%;object-fit:cover;display:block} .golge{position:absolute;inset:0;z-index:0} .ust{position:absolute;top:56px;left:56px;right:56px;display:flex;justify-content:space-between;align-items:flex-start} .radarcik{display:flex;align-items:center;gap:12px;background:#fff;color:var(--mavi);font:800 24px "Montserrat";letter-spacing:2px;padding:12px 20px;border-radius:999px;box-shadow:0 8px 20px rgba(0,0,0,.2)} .radarcik i{width:22px;height:22px;border-radius:50%;border:3px solid var(--turuncu);position:relative} .radarcik i::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--turuncu)} .cip{font-family:"Anton";font-size:40px;color:#fff;background:var(--turuncu);padding:6px 24px 10px;border-radius:14px;transform:rotate(4deg);box-shadow:0 8px 0 var(--kiremit)} .bant{font-family:"Anton";font-weight:400;line-height:1.28;letter-spacing:.5px} .bant span{background:#fff;color:var(--lacivert);padding:0 22px 6px;border-radius:14px;-webkit-box-decoration-break:clone;box-decoration-break:clone;box-shadow:0 10px 0 var(--turuncu)} .logo{width:250px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.35))} .bg{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:675px 675px;gap:8px;background:#fff} .bg img{min-height:0;object-position:center 35%} .golge{background:linear-gradient(180deg,rgba(24,64,119,.55) 0%,rgba(24,64,119,.25) 45%,rgba(24,64,119,.6) 100%)} h1{position:absolute;top:150px;left:56px;right:56px;font-size:{{baslik_boyut}}px} h1 .o{background:var(--turuncu);color:#fff;box-shadow:0 10px 0 var(--kiremit)} .radar{position:absolute;top:560px;left:50%;width:600px;height:600px;margin-left:-300px;border-radius:50%; background:radial-gradient(circle,var(--turuncu) 0 8px,transparent 9px), radial-gradient(circle,transparent 0 24.5%,rgba(58,88,158,.4) 25% 25.5%,transparent 26% 49.5%,rgba(58,88,158,.4) 50% 50.5%,transparent 51% 74.5%,rgba(58,88,158,.4) 75% 75.5%,transparent 76%), conic-gradient(from 18deg,rgba(241,145,7,.55),rgba(241,145,7,0) 80deg,transparent 360deg),rgba(255,255,255,.9); border:6px solid #fff;box-shadow:0 0 0 10px rgba(255,255,255,.35),0 30px 60px rgba(0,0,0,.35)} .radar::before,.radar::after{content:"";position:absolute;background:rgba(58,88,158,.3)} .radar::before{left:50%;top:0;bottom:0;width:2px}.radar::after{top:50%;left:0;right:0;height:2px} .blipler span{position:absolute;display:flex;align-items:center;gap:12px;font-family:"Anton";font-size:40px;letter-spacing:1px;color:#fff;background:var(--mavi);padding:4px 18px 10px 14px;border-radius:12px;white-space:nowrap;box-shadow:0 8px 0 var(--lacivert);z-index:2} .blipler i{width:18px;height:18px;border-radius:50%;background:var(--turuncu);box-shadow:0 0 0 7px rgba(241,145,7,.4)} .blipler span:nth-child(1){left:330px;top:100px}.blipler span:nth-child(2){left:30px;top:170px} .blipler span:nth-child(3){left:350px;top:330px}.blipler span:nth-child(4){left:20px;top:390px} .blipler span:nth-child(5){left:200px;top:500px}.blipler span:nth-child(6){left:170px;top:30px} .blipler span:nth-child(7){left:380px;top:450px}.blipler span:nth-child(8){left:60px;top:280px} .alt{position:absolute;left:56px;right:56px;bottom:56px;display:flex;justify-content:space-between;align-items:flex-end} .kaydir{font-family:"Anton";font-size:40px;color:var(--lacivert);background:#fff;padding:6px 22px 10px;border-radius:14px;box-shadow:0 8px 0 var(--turuncu)} </style></head><body><div class="frame">

</div></body></html>
