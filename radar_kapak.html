<!doctype html><html lang="tr"><head><meta charset="utf-8"><style>@font-face{font-family:"Anton";src:url("../fonts/Anton-Regular.ttf")}@font-face{font-family:"Montserrat";src:url("../fonts/Montserrat.ttf");font-weight:100 900} :root{--mavi:#3A589E;--lacivert:#184077;--turuncu:#F19107;--kiremit:#F15725;--zemin:#F3F6FC} *{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1350px;overflow:hidden} body{font-family:"Montserrat",sans-serif;-webkit-font-smoothing:antialiased} .mono{font-family:"DejaVu Sans Mono","Noto Sans Mono",monospace} .anton{font-family:"Anton";font-weight:400;line-height:1.02;letter-spacing:.3px} .frame{position:relative;width:1080px;height:1350px;overflow:hidden;color:var(--lacivert); background:radial-gradient(900px 700px at 100% 0%,rgba(58,88,158,.18),transparent 60%),radial-gradient(800px 600px at 0% 100%,rgba(241,145,7,.16),transparent 60%),var(--zemin)} .frame::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(58,88,158,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(58,88,158,.08) 1px,transparent 1px);background-size:36px 36px} .frame>*{z-index:1} .kose{position:absolute;width:64px;height:64px;border:5px solid var(--turuncu);z-index:2} .k1{top:40px;left:40px;border-right:0;border-bottom:0}.k2{top:40px;right:40px;border-left:0;border-bottom:0}.k3{bottom:40px;left:40px;border-right:0;border-top:0}.k4{bottom:40px;right:40px;border-left:0;border-top:0} .hud{position:absolute;top:78px;left:84px;right:84px;display:flex;justify-content:space-between;align-items:center;font-size:24px;letter-spacing:2px;color:var(--mavi);font-weight:700} .hud .canli{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--turuncu);box-shadow:0 0 0 6px rgba(241,145,7,.25);margin-right:14px;vertical-align:middle} .cip{font-family:"Anton";font-size:36px;letter-spacing:2px;color:#fff;padding:6px 24px 10px;border-radius:14px;background:var(--mavi);box-shadow:0 8px 0 var(--turu
